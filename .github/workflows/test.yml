name: Playwright Tests with Allure Report

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Дозволяє ручний запуск

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Потрібно для коректного збереження історії

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test tests/
        continue-on-error: true # Продовжити навіть якщо тести впали (для збору звіту)

      - name: Copy Allure history from previous run
        run: |
          # Створюємо тимчасову директорію для історії
          mkdir -p allure-results/history

          # Перевіряємо, чи існує гілка з попереднім звітом
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            echo "📥 Fetching previous Allure history from gh-pages branch..."
            git fetch origin gh-pages
            git show origin/gh-pages:allure-history/history.json > allure-results/history/history.json 2>/dev/null || true
            echo "✅ History copied successfully"
          else
            echo "⚠️ No previous Allure report found. Starting fresh."
          fi

      - name: Generate Allure Report
        run: |
          npx allure generate allure-results --clean -o allure-report
          # Зберігаємо історію для наступного запуску
          mkdir -p allure-report/history
          cp allure-results/history.json allure-report/history/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          destination_dir: .
          keep_files: true # Зберігати попередні звіти для історії
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy Allure Report for commit ${{ github.sha }}'

      - name: Get GitHub Pages URL
        id: vars
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          PAGES_URL="https://${OWNER}.github.io/${REPO_NAME}"
          echo "pages_url=${PAGES_URL}" >> $GITHUB_OUTPUT
          echo "📊 Allure Report URL: ${PAGES_URL}"

      - name: Upload test results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: |
            test-results/
            allure-results/
            allure-report/
          retention-days: 30

      - name: Comment PR with report URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const reportUrl = `${{ steps.vars.outputs.pages_url }}`;
            const comment = `## 🧪 Allure Test Report\n\n📊 **Report URL:** ${reportUrl}\n\n✅ Tests completed. Click the link above to view detailed results.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Output report link in summary
        if: always()
        run: |
          echo "### 📊 Allure Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Report URL:** ${{ steps.vars.outputs.pages_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Job Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
